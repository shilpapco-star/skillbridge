<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
  (function() {
    const saved = localStorage.getItem("skillbridge_theme") || "light";
    document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
  <title>SkillBridge — Badges</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-logo">🎯 SkillBridge</div>
    <nav class="app-nav">
      <a href="dashboard.html">▦ Dashboard</a>
      <a href="index.html">👤 Profile</a>
      <a href="roadmap.html">🧭 Roadmap</a>
      <a href="assessment.html">📝 Assessment</a>
      <a href="resume.html">📄 Resume</a>
      <a href="projects.html">🔗 Projects</a>
      <a href="assistant.html">💬 Assistant</a>
      <a href="badges.html" class="active">🏅 Badges</a>
    </nav>
    <button id="themeToggle" class="theme-toggle app-theme-toggle" type="button">🌙</button>
    <button class="app-logout" onclick="logout()">⎋ Log out</button>
  </aside>

  
  <main class="app-main">
    <div class="container">
    <h1>Your badges</h1>
    <p class="subtitle">Earned by taking real action across SkillBridge.</p>

    <div id="badgeGrid" class="badge-grid"></div>
  </div>
  </main>
<script type="module">
  import { requireAuth } from "./js/auth.js";
  requireAuth();
</script>
<script src="js/gamification.js"></script>
<script src="js/script.js"></script>  <!-- or whatever that page already has -->
  <script src="js/gamification.js"></script>
  <script>
    const { BADGE_DEFINITIONS, getBadges } = window.SkillBridgeGamification;
    const earned = getBadges();
    const grid = document.getElementById("badgeGrid");

    Object.keys(BADGE_DEFINITIONS).forEach((id) => {
      const badge = BADGE_DEFINITIONS[id];
      const isEarned = earned.includes(id);

      const card = document.createElement("div");
      card.className = "badge-card " + (isEarned ? "earned" : "locked");
      card.innerHTML = `
        <div class="badge-icon">${isEarned ? badge.icon : "🔒"}</div>
        <div class="badge-name">${badge.name}</div>
        <div class="badge-desc">${badge.desc}</div>
      `;
      grid.appendChild(card);
    });
  </script>
  <script src="js/theme.js"></script>
</body>
</html>
