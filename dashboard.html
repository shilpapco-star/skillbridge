<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
  (function() {
    const saved = localStorage.getItem("skillbridge_theme") || "light";
    document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
  <title>SkillBridge — Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="db-body">

  <nav class="navbar">
    <div class="logo">SkillBridge</div>
    <div class="nav-links">
      <a href="index.html">Profile</a>
      <a href="roadmap.html">Roadmap</a>
      <a href="assessment.html">Assessment</a>
      <a href="resume.html">Resume</a>
      <a href="assistant.html">Assistant</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <button id="themeToggle" class="theme-toggle" type="button">🌙</button>
      <a href="#" onclick="logout(); return false;">Log out</a>
    </div>
  </nav>

  <div id="noProfile" class="hidden db-empty">
    <h1>No profile found</h1>
    <p class="subtitle">Please <a href="index.html">create your profile</a> first to see your dashboard.</p>
  </div>

  <main id="dashboardContent" class="db-main hidden">

    <section class="db-hero">
      <div class="db-ring-wrap">
        <svg viewBox="0 0 200 200" class="db-ring">
          <circle cx="100" cy="100" r="88" class="db-ring-track" />
          <circle cx="100" cy="100" r="88" class="db-ring-fill" id="ringFill" />
        </svg>
        <div class="db-ring-center">
          <div class="db-ring-percent" id="ringPercent">0%</div>
        </div>
      </div>
      <div class="db-hero-text">
        <p class="db-eyebrow" id="dbEyebrow">YOUR PATH</p>
        <h1 class="db-heading" id="dbHeading">Welcome back</h1>
        <p class="db-sub" id="dbSub"></p>
      </div>
    </section>

    <section class="db-focus" id="dbFocus">
      <!-- filled by JS -->
    </section>

  </main>

  <script type="module">
  import { requireAuth } from "./js/auth.js";
  requireAuth();
</script>
  <script src="js/dashboard.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
