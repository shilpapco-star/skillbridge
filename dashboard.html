<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge — Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="logo">SkillBridge</div>
    <div class="nav-links">
  <a href="index.html">Profile</a>
  <a href="roadmap.html">Roadmap</a>
  <a href="assessment.html">Assessment</a>
  <a href="resume.html">Resume</a>
  <a href="dashboard.html">Dashboard</a>
</div>
  </nav>

  <main class="container wide">
    <div id="noProfile" class="hidden">
      <h1>No profile found</h1>
      <p class="subtitle">
        Please <a href="index.html">create your profile</a> first to see your dashboard.
      </p>
    </div>

    <div id="dashboardContent" class="hidden">
      <h1 id="dashHeading">Your dashboard</h1>
      <p class="subtitle" id="dashSubtitle"></p>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-value" id="statHave">0</div>
          <div class="stat-label">Skills you have</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statMissing">0</div>
          <div class="stat-label">Skills to learn</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statPercent">0%</div>
          <div class="stat-label">Roadmap complete</div>
        </div>
      </div>

      <div class="chart-card">
        <h3 class="section-heading">Skill coverage</h3>
        <canvas id="coverageChart" width="300" height="300"></canvas>
      </div>
    </div>
  </main>

  <script src="js/dashboard.js"></script>
</body>
</html>
