<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
  (function() {
    const saved = localStorage.getItem("skillbridge_theme") || "light";
    document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
  <title>SkillBridge — Career Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard2.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="d2-shell">
  <aside class="d2-sidebar">
    <a class="d2-logo" href="dashboard.html"><span>✦</span> skillbridge</a>
    <nav class="d2-nav">
      <a href="dashboard.html"><span>▦</span> Overview</a>
      <a href="learn.html"><span>▶</span> Learn</a>
      <a href="roadmap.html"><span>⌁</span> My roadmap</a>
      <a href="projects.html"><span>◈</span> Projects</a>
      <a href="assessment.html"><span>✓</span> Assessments</a>
      <a href="resume.html"><span>▤</span> Resume</a>
      <a href="assistant.html" class="active"><span>◌</span> Career assistant</a>
      <a href="badges.html"><span>🏅</span> Badges</a>
      <a href="dashboard.html#hackathons"><span>⚡</span> Hackathons</a>
    </nav>
    <div class="d2-sidebar-bottom">
      <a class="d2-settings-link" href="index.html">⚙ Settings</a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle colour theme">🌙</button>
      <button class="d2-logout" onclick="logout()">↪ Log out</button>
    </div>
  </aside>

  <main class="d2-main">
    <div class="container">
    <div id="noProfile" class="hidden">
      <h1>No profile found</h1>
      <p class="subtitle">
        Please <a href="index.html">create your profile</a> first to chat with your assistant.
      </p>
    </div>

    <div id="assistantContent" class="hidden">
      <h1>Career assistant</h1>
      <p class="subtitle">Ask about your roadmap, missing skills, or what to do next.</p>

      <div id="chatWindow" class="chat-window"></div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="e.g. What should I learn next?" autocomplete="off" />
        <button type="button" id="sendBtn">Send</button>
      </div>

      <div class="suggested-questions" id="suggestedQuestions"></div>
    </div>
    </div>
  </main>
</div>
    <script type="module">
    import { requireAuth } from "./js/auth.js";
    requireAuth();
  </script>
  <script src="js/gamification.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/theme.js"></script>
</body>

</html>
