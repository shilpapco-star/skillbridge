<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const saved = localStorage.getItem("skillbridge_theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge — Discover Projects</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-logo">🎯 SkillBridge</div>
    <nav class="app-nav">
      <a href="dashboard.html">▦ Dashboard</a>
      <a href="index.html">👤 Profile</a>
      <a href="roadmap.html">🧭 Roadmap</a>
      <a href="assessment.html">📝 Assessment</a>
      <a href="resume.html">📄 Resume</a>
      <a href="projects.html" class="active">🔗 Projects</a>
      <a href="assistant.html">💬 Assistant</a>
      <a href="badges.html">🏅 Badges</a>
    </nav>
    <button id="themeToggle" class="theme-toggle app-theme-toggle" type="button">🌙</button>
    <button class="app-logout" onclick="logout()">⎋ Log out</button>
  </aside>

  

  <main class="app-main">
    <div class="container">
    <h1>Discover projects</h1>
    <p class="subtitle">Search any skill — we'll pull the most popular real projects on GitHub right now.</p>

    <div class="gh-search-row">
      <input type="text" id="ghSearchInput" placeholder="e.g. React, Node.js, Data Analysis..." />
      <button type="button" id="ghSearchBtn">Search</button>
    </div>

    <div id="ghStatus" class="gh-status"></div>
    <div id="ghResults" class="gh-results"></div>
  </div>
  </main>

  <script src="js/theme.js"></script>
  <script type="module">
    import { requireAuth } from "./js/auth.js";
    requireAuth();
  </script>
  <script src="js/projects.js"></script>
</body>
</html>
