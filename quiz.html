<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const saved = localStorage.getItem("skillbridge_theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBridge — Skill Test</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">SkillBridge</div>
    <div class="nav-links">
      <a href="assessment.html">← Back to Assessment</a>
      <button id="themeToggle" class="theme-toggle" type="button">🌙</button>
    </div>
  </nav>

  <main class="container">
    <div id="quizArea">
      <div class="quiz-header">
        <h1 id="quizSkillName">Loading test...</h1>
        <div class="quiz-timer" id="quizTimer">--:--</div>
      </div>
      <p class="quiz-progress" id="quizProgress"></p>

      <div id="questionCard" class="question-card"></div>

      <div class="quiz-nav">
        <button type="button" id="prevBtn" class="quiz-nav-btn">← Previous</button>
        <button type="button" id="skipBtn" class="quiz-nav-btn">Skip →</button>
        <button type="button" id="nextBtn" class="quiz-nav-btn primary">Next →</button>
        <button type="button" id="submitBtn" class="quiz-nav-btn primary hidden">Submit test</button>
      </div>
    </div>

    <div id="resultsArea" class="hidden">
      <h1 id="resultsHeading"></h1>
      <div class="results-grid">
        <div class="result-stat">
          <div class="result-number" id="resultScore">0%</div>
          <div class="result-label">Score</div>
        </div>
        <div class="result-stat">
          <div class="result-number" id="resultCorrect">0/0</div>
          <div class="result-label">Correct answers</div>
        </div>
        <div class="result-stat">
          <div class="result-number" id="resultTime">0:00</div>
          <div class="result-label">Time taken</div>
        </div>
      </div>
      <p id="resultVerdict" class="result-verdict"></p>
      <div class="results-actions">
        <a href="assessment.html" class="quiz-nav-btn primary">Back to Assessment</a>
        <button type="button" id="retakeBtn" class="quiz-nav-btn">Retake test</button>
      </div>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script type="module">
    import { requireAuth } from "./js/auth.js";
    requireAuth();
  </script>
  <script src="js/gamification.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
