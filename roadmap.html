<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
  (function() {
    const saved = localStorage.getItem("skillbridge_theme") || "light";
    document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <title>SkillBridge — Roadmap</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-logo">🎯 SkillBridge</div>
    <nav class="app-nav">
      <a href="dashboard.html">▦ Dashboard</a>
      <a href="index.html">👤 Profile</a>
      <a href="roadmap.html" class="active">🧭 Roadmap</a>
      <a href="assessment.html">📝 Assessment</a>
      <a href="resume.html">📄 Resume</a>
      <a href="projects.html">🔗 Projects</a>
      <a href="assistant.html">💬 Assistant</a>
      <a href="badges.html">🏅 Badges</a>
    </nav>
    <button id="themeToggle" class="theme-toggle app-theme-toggle" type="button">🌙</button>
    <button class="app-logout" onclick="logout()">⎋ Log out</button>
  </aside>
  <main class="app-main">
    <div class="container">
    <div id="noProfile" class="hidden">
      <h1>No profile found</h1>
      <p class="subtitle">
        Please <a href="index.html">create your profile</a> first so we know your target role and current skills.
      </p>
    </div>

    <div id="roadmapContent" class="hidden">
  <h1 id="roleHeading">Your roadmap</h1>
  <p class="subtitle" id="roleSubtitle"></p>

  <div class="progress-wrapper">
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <span id="progressLabel" class="progress-label"></span>
    
  </div>

  <div id="upNextBanner" class="up-next-banner"></div>
  <div class="chart-card">
  <canvas id="skillChart" width="300" height="220"></canvas>
</div>

  <h3 class="section-heading">Skill checklist</h3>
  <ul id="skillList" class="skill-list"></ul>
</div>
</div>
  </main>

  <script type="module">
  import { requireAuth } from "./js/auth.js";
  requireAuth();
</script>
<script src="js/gamification.js"></script>
<script src="js/theme.js"></script>
<script src="js/roadmap.js"></script>
</body>
</html>
